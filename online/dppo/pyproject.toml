[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dppo"
version = "0.8.0"
description = "Fine-tuning diffusion policies with PPO."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "av==12.3.0",
    "einops==0.8.0",
    "gdown==5.2.0",
    "gymnasium>=0.29.1",
    "hydra-core==1.3.2",
    "imageio==2.35.1",
    "matplotlib==3.7.5",
    "omegaconf==2.3.0",
    "pretty_errors==1.2.25",
    "torch==2.7.1",
    "tqdm==4.66.5",
    "wandb==0.17.7"
]

[project.optional-dependencies]
gym = [
    "d4rl @ git+https://github.com/Farama-Foundation/D4RL@master",
    "gymnasium[mujoco]",
    "mujoco==3.1.6",
]
kitchen = [
    "d4rl",
    "dm_control==1.0.16",
    "mujoco==3.1.6",
    "gymnasium[mujoco]",
]
robomimic = [
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@v1.4.1",
    "mujoco==3.1.6",
]
d3il = [
    "d4rl",
    "gin-config",
    "pin",
]
furniture = [
    "d4rl",
    "ipdb==0.13.13",
]
exact = [   # exact likelihood
    "torchdiffeq",
]
amd = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "pytorch-triton-rocm==3.0.0",
]
all = [
    "d4rl",
    "gin-config",
    "ipdb==0.13.13",
    "pin",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@v1.4.1",
]

[project.urls]
Homepage = "https://diffusion-ppo.github.io/"

[tool.setuptools.packages.find]
exclude = []

[tool.wheel]
exclude = []

# ---------------------------------------------------------------------------
# uv-specific: route the AMD extra's torch/torchvision to the ROCm wheel index
# so that `uv pip install -e .[amd]` pulls ROCm builds automatically.
# The base torch dependency (no extra) resolves from PyPI / whichever
# --index-url the user passes at install time (e.g. for CUDA clusters:
#   uv pip install -e . --index-url https://download.pytorch.org/whl/cu128
# torch==2.7.1+cu128 is required for Blackwell/B200 (sm_100a) support; the
# cu128 wheels also cover older Ampere/Hopper GPUs, so this index works for
# any NVIDIA cluster, not just B200.
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", extra = "amd" },
]
torchvision = [
    { index = "pytorch-rocm", extra = "amd" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "amd" },
]
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.1"
explicit = true
